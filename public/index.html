<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spine Viewer</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./timeline.css">
</head>

<body>
    <div id="container">
        <!-- Side Panel -->
        <aside id="controls_side_panel">
            <div id="side_panel_sections">
                <details class="side-panel-section" id="section-skeleton" open>
                    <summary>Skeleton</summary>
                    <div id="skeleton-info" class="side-panel-info">
                        <!-- Skeleton metadata rows will be dynamically added here -->
                    </div>
                </details>

                <details class="side-panel-section" id="section-animations" open>
                    <summary>Animations</summary>
                    <ul id="animations-list" class="side-panel-list">
                        <!-- Animation list items will be dynamically added here -->
                    </ul>
                </details>

                <details class="side-panel-section" id="section-skins">
                    <summary>Skins</summary>
                    <ul id="skins-list" class="side-panel-list">
                        <!-- Skin list items will be dynamically added here -->
                    </ul>
                </details>

                <details class="side-panel-section" id="section-slots">
                    <summary>Slots</summary>
                    <ul id="slots-list" class="side-panel-list">
                        <!-- Slot list items will be dynamically added here -->
                    </ul>
                </details>

                <details class="side-panel-section" id="section-events">
                    <summary>Events</summary>
                    <ul id="events-list" class="side-panel-list">
                        <!-- Event list items will be dynamically added here -->
                    </ul>
                </details>
            </div>
            <div id="default_spine_button" class="bottom-button">
                <a href="#">Load Default Asset</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main_content">
            <!-- Stats -->
            <section id="stats">
                <div class="stat">Draw Calls: <span id="draw-calls">0</span></div>
                <div class="stat">Vertex Count: <span id="vertex-count">0</span></div>
                <div class="stat">Triangles: <span id="triangles">0</span></div>
            </section>

            <!-- Canvas Drop Zone -->
            <section id="canvas_editor" class="droppable_zone draggableArea">
                <p id="drop_message">Drag and drop or click to select your Spine files (.json, .atlas, and the texture image(s) the atlas references)</p>
            </section>

            <!-- Bottom Controls Panel -->
            <section class="bottom_controls">
                <!-- Animation Controls -->
                <div class="control-group">
                    <div class="control-panel">
                        <h3>Playback</h3>
                        <button id="play-button">Play</button>
                        <div id="timeline-player">
                            <div class="timeline-time" id="current-time">0.0s</div>
                            <div class="timeline-track" id="timeline-track">
                                <div class="timeline-progress" id="timeline-progress"></div>
                                <div class="timeline-thumb" id="timeline-thumb"></div>
                                <div class="timeline-events" id="timeline-events"></div>
                                <!-- Example keyframe -->
                                <!-- <div class="timeline-keyframe" style="left: 25%;"></div>
                                <div class="timeline-keyframe" style="left: 75%;"></div> -->
                            </div>
                            <div class="timeline-time" id="total-duration">10.0s</div>
                        </div>
                    </div>
                </div>

                <!-- Options -->
                <div class="control-group">
                    <div class="control-group">
                        <div class="control-panel">
                            <h3>Options</h3>
                            <label>
                                <input type="checkbox" data-key="drawBounds" /> Draw Bounds
                            </label>
                            <label class="option-checkbox">
                                <input type="checkbox" data-key="enableLoop" /> Enable Loop
                            </label>
                            <!-- <label class="option-checkbox">
                            <input type="checkbox" /> Show Grid
                        </label> -->
                        </div>
                    </div>

                </div>
            </section>
        </main>
    </div>

</body>

</html>
